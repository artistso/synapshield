name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - run: python simulations/python/synapshield_model_v2.py --duration-days 1 --grid-points 41 --output model-report.json
      - run: python tools/static_claim_audit.py --root . --output audit/static-claim-report.json --fail-on-findings
      - run: python tools/hf_model_audit.py --root . --numerical-report model-report.json --output audit/model-panel-packet.json --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: audit-reports-py${{ matrix.python-version }}
          path: |
            model-report.json
            audit/static-claim-report.json
            audit/model-panel-packet.json
